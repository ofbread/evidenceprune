[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidenceprune"
version = "0.2.0"
description = "Prune web pages to the sentences that are relevant for a claim with small distilled models, and evaluate the evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "torch>=2.4",
    "transformers>=5.14",
]

[project.optional-dependencies]
claude = ["anthropic"]

[tool.setuptools.packages.find]
include = ["evidenceprune*"]
